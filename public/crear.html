<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear Videojuego</title>
</head>
<body>
  <h1>Nuevo Videojuego</h1>
  <form id="formulario">
    <input type="text" name="nombre" placeholder="Nombre" required><br>
    <input type="text" name="genero" placeholder="Género" required><br>
    <input type="text" name="plataforma" placeholder="Plataforma" required><br>
    <input type="number" name="precio" placeholder="Precio" required><br>
    <input type="text" name="desarrollador" placeholder="Desarrollador"><br>
    <textarea name="descripcion" placeholder="Descripción"></textarea><br>
    <button type="submit">Guardar</button>
  </form>
  <a href="index.html">Volver</a>

  <script>
    document.getElementById('formulario').addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch('/api/videojuegos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await res.json();
      alert(result.mensaje);
      if (result.exito) location.href = 'index.html';
    });
  </script>
</body>
</html>
